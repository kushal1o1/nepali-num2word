name: CI & Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Run black check
        run: black --check --target-version py38 nepali_num2word/ cli/ tests/

      - name: Run isort check
        run: isort --check-only nepali_num2word/ cli/ tests/

      - name: Run flake8
        run: flake8 nepali_num2word/ cli/ tests/

      - name: Run mypy type check
        run: mypy nepali_num2word/ --ignore-missing-imports || true

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Install package in development mode
        run: pip install -e .

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=nepali_num2word --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install package
        run: pip install -e .

      - name: Test CLI commands
        run: |
          nepaliword 123456 --lang np
          nepaliword 123456 --lang en
          nepaliformat 1234567 --lang np
          nepaliformat 1234567 --lang en
          nepalicompact 4200000 --lang np
          nepalicompact 4200000 --lang en
